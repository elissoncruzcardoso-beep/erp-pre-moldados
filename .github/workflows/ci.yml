name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: Build e checks de seguranca
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      SHADOW_DATABASE_URL: postgresql://ci:ci@localhost:5432/shadow?schema=public
      AUTH_SECRET: ci_AUTH_SECRET_12345678901234567890123456789012345678901234
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      TELEGRAM_BOT_TOKEN: ci-token
      TELEGRAM_WEBHOOK_SECRET: ci_TELEGRAM_WEBHOOK_SECRET_123456789012345678901234567890
      CRON_SECRET: ci_CRON_SECRET_123456789012345678901234567890
      CRON_USER_EMAIL: admin@erp.local

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Prepare Prisma shadow database
        run: |
          node - <<'NODE'
          const { Client } = require("pg");

          async function main() {
            const client = new Client({
              connectionString: "postgresql://ci:ci@localhost:5432/postgres"
            });

            await client.connect();
            const result = await client.query("SELECT 1 FROM pg_database WHERE datname = $1", ["shadow"]);

            if (result.rowCount === 0) {
              await client.query("CREATE DATABASE shadow");
            }

            await client.end();
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Environment guard
        run: npm run security:check-env

      - name: SQL raw guard
        run: npm run security:check-sql

      - name: Query limit guard
        run: npm run security:check-queries

      - name: Public exposure guard
        run: npm run security:check-public-exposure

      - name: API error leak guard
        run: npm run security:check-api-errors

      - name: API auth guard
        run: npm run security:check-api-auth

      - name: API audit guard
        run: npm run security:check-api-audit

      - name: Prisma migrations guard
        run: npm run security:check-migrations

      - name: Backup config guard
        env:
          BACKUP_DATABASE_URL: postgresql://backup:secret@ci-backup.local:5432/postgres
          RESTORE_DATABASE_URL: postgresql://restore:secret@ci-backup.local:5432/precast_erp_restore_ci
          BACKUP_S3_BUCKET: precast-backups
          BACKUP_S3_PREFIX: precast-erp/postgres
          AWS_REGION: sa-east-1
          AWS_ACCESS_KEY_ID: fake-access-key
          AWS_SECRET_ACCESS_KEY: fake-secret-key
        run: npm run backup:check-config -- --skip-tools

      - name: Prisma validate
        run: npx prisma validate

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
